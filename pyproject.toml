[project]
name = "anchor-mem"
version = "0.1.0"
description = "Configuration-driven hybrid memory retrieval for AML textual track"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "numpy>=2,<3",
  "tiktoken>=0.9,<1",
  "openai>=1.70,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
anchor-mem = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
