version: 0.1.0
competition_mode: false
database_dir: ../../data/openrouter-index
snapshot_dir: ../../artifacts/service
host: 0.0.0.0
port: 8000
workers: 1
auth_key_env: AML_MEMORY_KEY
log_level: info
llm:
  name: openai/gpt-4o-mini
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENAI_API_KEY
  temperature: 0.0
  max_output_tokens: 4096
  timeout_seconds: 120.0
  retries: 4
embedding:
  name: openai/text-embedding-3-small
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENAI_API_KEY
  dimensions: 1024
  batch_size: 10
  timeout_seconds: 120.0
  retries: 4
chunk:
  tokenizer: o200k_base
  max_tokens: 512
  overlap_tokens: 64
facts:
  prompt_path: ../../prompts/extract-facts.txt
  prior_context_tokens: 1024
retrieval:
  bm25_candidates: 50
  chunk_vector_candidates: 50
  fact_vector_candidates: 50
  bm25_weight: 1.0
  chunk_vector_weight: 1.0
  fact_vector_weight: 0.0
  rrf_k: 60
  question_weight: 1.0
  options_weight: 0.5
  seed_count: 20
  neighbor_count: 0
  evidence_budget_tokens: 16000
  max_results: 100
